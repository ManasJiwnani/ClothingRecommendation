[project]
name = "fashionr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MandlikGauri",}
]
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.7.22",
    "cloudinary>=1.46.2",
    "fastapi>=0.141.1",
    "google-genai>=2.22.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.4",
]

[project.scripts]
fashionr = "fashionr:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false